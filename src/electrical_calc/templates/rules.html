{% extends "base.html" %}
{% block title %}计算依据 · 电气计算台{% endblock %}
{% block content %}
<section class="project-head">
  <div><p class="eyebrow">REFERENCE CONTROL</p><h1>计算依据</h1><p>只录入实际文件中核实过的条文原文。平台不自动概括、改写或补全规范内容。</p></div>
</section>
<div class="alert warning"><strong>批准条件</strong><span>文件名、条文号、原文和 PDF 页码必须完整。状态变更不会改写既有计算记录中的依据快照。</span></div>
<div class="rule-list">
{% for rule in rules %}
  <form method="post" action="/rules/{{ rule.id }}" class="rule-card">
    <div class="rule-title"><div><p class="eyebrow">{{ rule.code }}</p><input name="name" value="{{ rule.name }}" aria-label="依据名称"></div><select name="status"><option value="pending" {% if rule.status=="pending" %}selected{% endif %}>待核实</option><option value="verified" {% if rule.status=="verified" %}selected{% endif %}>已核实</option><option value="approved" {% if rule.status=="approved" %}selected{% endif %}>已批准</option></select></div>
    <div class="form-grid">
      <label>文件名称<input name="document_name" value="{{ rule.document_name }}"></label>
      <label>文件版本<input name="document_version" value="{{ rule.document_version }}"></label>
      <label>条文号<input name="clause_no" value="{{ rule.clause_no }}"></label>
      <label>PDF 页码<input name="page_no" value="{{ rule.page_no }}"></label>
    </div>
    <label>规范原文<textarea name="original_text" rows="5">{{ rule.original_text }}</textarea></label>
    <label>备注<textarea name="note" rows="2">{{ rule.note }}</textarea></label>
    <div class="rule-actions"><span>更新：{{ rule.updated_at }}</span><button type="submit">保存依据</button></div>
  </form>
{% endfor %}
</div>
{% endblock %}
