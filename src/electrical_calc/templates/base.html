<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}电气计算台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=20260726-2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">Ω</span>
      <span><strong>电气计算台</strong><small>可复核 · 可追溯 · 不猜测</small></span>
    </a>
    <nav>
      <a href="/quick">快速计算</a>
      <a href="/motor">电动机</a>
      <a href="/complete-circuit">图纸核验</a>
      <a href="/">项目</a>
      <a href="/rules">计算依据</a>
    </nav>
  </header>
  <main class="page">
    {% if message %}<div class="notice">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>本地个人工具 · 未批准依据的结果只用于原型验证和算术复核</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
